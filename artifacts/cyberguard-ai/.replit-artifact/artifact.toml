kind = "web"
previewPath = "/"
title = "CyberGuard AI"
description = "A cybersecurity operations dashboard for clearly labeled simulated endpoint events, scan workflows, log analysis, and explainable anomaly findings, with separate readiness states for real devices and ML models."
version = "1.0.0"
id = "artifacts/cyberguard-ai"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26082

[services.development]
run = "pnpm --filter @workspace/cyberguard-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cyberguard-ai", "run", "build" ]
serve = "static"
publicDir = "artifacts/cyberguard-ai/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26082"
BASE_PATH = "/"
